name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked CPU dependencies
        run: uv sync --all-groups --locked
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Syntax
        run: uv run --no-sync python -m compileall -q pat_embedder scripts train.py
      - name: Tests
        run: uv run --no-sync pytest -q
