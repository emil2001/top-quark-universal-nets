[project]
name = "pat-embedder"
version = "0.1.0"
description = "MLP, DETR and Lorentz geometric algebra models for multiprocess event reconstruction."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Top-Lab" }]
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pytorch-lightning>=2.4",
    "mlflow>=2.15,<3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pat_embedder"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "PyYAML>=6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pat_embedder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
